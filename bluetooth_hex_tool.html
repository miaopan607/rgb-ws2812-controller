<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蓝牙彩灯 Hex 生成工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-weak: #e6f5f2;
      --danger: #b91c1c;
      --mono: "Cascadia Mono", "Consolas", monospace;
      --sans: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 28px auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .header {
      grid-column: 1 / -1;
      padding: 0 2px 4px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
    }

    .sub-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-heading .section-title {
      margin: 0;
    }

    .panel-heading.compact {
      align-items: center;
      margin-bottom: 10px;
    }

    .panel-heading.compact .sub-title {
      margin: 0;
    }

    .inline-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      white-space: nowrap;
    }

    .inline-label select {
      width: 76px;
      height: 34px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    label {
      font-weight: 600;
      color: #374151;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 10px;
      align-items: center;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .mode-block {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .flow-order {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .flow-lamp {
      position: relative;
      display: grid;
      height: auto;
      min-height: 74px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f9fafb;
      color: var(--text);
      cursor: pointer;
    }

    .flow-lamp.selected {
      border-color: var(--accent);
      background: #fff;
      color: var(--accent);
    }

    .flow-lamp-number {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .flow-lamp:not(.selected) .flow-lamp-number {
      display: none;
    }

    .flow-lamp-step {
      display: none;
      min-height: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .advanced-flow {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eef1f5;
    }

    .flow-frames {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .flow-frame-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfcfd;
    }

    .flow-frame-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .flow-frame-title code {
      font-family: var(--mono);
      color: var(--muted);
      font-weight: 600;
    }

    .frame-lamps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .frame-lamp {
      height: 34px;
      padding: 0;
      border-radius: 6px;
      font-size: 12px;
    }

    .frame-lamp.selected {
      border-color: var(--accent);
      background: var(--accent-weak);
      color: var(--accent);
      font-weight: 700;
    }

    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button:hover {
      filter: brightness(0.98);
    }

    .output {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .hex-box {
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #111827;
      color: #d1fae5;
      font-family: var(--mono);
      font-size: 18px;
      line-height: 1.7;
      word-break: break-word;
      user-select: all;
    }

    .byte-table {
      display: grid;
      gap: 6px;
      font-family: var(--mono);
      font-size: 13px;
    }

    .byte-row {
      display: grid;
      grid-template-columns: 58px 80px 1fr;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #eef1f5;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      color: var(--danger);
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100vw - 20px, 1120px);
        margin: 16px auto;
      }

      .flow-order {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .byte-row {
        grid-template-columns: 48px 58px 1fr;
      }

      .flow-frames {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="header">
      <h1>蓝牙彩灯 Hex 生成工具</h1>
      <p class="subtitle">选择参数后复制下方可变长度 Hex，用串口工具以“HEX 发送/十六进制发送”模式发给蓝牙模块。</p>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2 class="section-title">参数</h2>
        <button type="button" id="resetButton">恢复默认</button>
      </div>
      <div class="status settings-status" id="settingsStatus"></div>
      <div class="grid">
        <div class="field">
          <label for="mode">模式</label>
          <select id="mode">
            <option value="0">静态模式</option>
            <option value="1">流水模式</option>
            <option value="2">呼吸模式</option>
            <option value="3">Disco 模式</option>
            <option value="4">渐变模式</option>
            <option value="5">流动渐变模式</option>
          </select>
        </div>

        <div class="field" id="colorBlock">
          <label for="color">颜色</label>
          <input id="color" type="color" value="#00ff00">
          <div class="hint" id="colorHint">RGB: 00 FF 00</div>
        </div>

        <div class="field">
          <label for="brightness">亮度</label>
          <div class="range-row">
            <input id="brightness" type="range" min="0" max="255" value="96">
            <input id="brightnessNumber" type="number" min="0" max="255" value="96">
          </div>
          <div class="hint">0 为全灭，255 为最大亮度。</div>
        </div>

        <div class="field" id="periodBlock">
          <label for="period" id="periodLabel">周期</label>
          <div class="range-row">
            <input id="period" type="range" min="1" max="255" value="20">
            <input id="periodNumber" type="number" min="1" max="255" value="20">
          </div>
          <div class="hint" id="periodHint">流水模式单位 10ms，25 表示 250ms 切换一次画面。</div>
        </div>
      </div>

      <div class="mode-block" id="flowBlock">
        <h2 class="section-title">流水</h2>
        <h3 class="sub-title">基础流水</h3>
        <div class="flow-order" id="flowOrder"></div>
        <div class="quick-buttons">
          <button type="button" data-order="3,2,1,0,4,5,6,7">正序</button>
          <button type="button" data-order="7,6,5,4,0,1,2,3">反序</button>
          <button type="button" data-order="3,1,4,6,2,0,5,7">先偶后奇</button>
          <button type="button" data-order="3,4,2,5,1,6,0,7">交错</button>
          <button type="button" id="clearOrderButton">清空选择</button>
        </div>
        <div class="hint">按想要的流水顺序点击灯块；基础流水会自动转换为每个画面只亮一颗灯的新版协议。</div>

        <div class="advanced-flow">
          <div class="panel-heading compact">
            <h3 class="sub-title">高级画面</h3>
            <label class="inline-label" for="flowCount">画面数量
              <select id="flowCount"></select>
            </label>
          </div>
          <div class="flow-frames" id="flowFrames"></div>
          <div class="quick-buttons">
            <button type="button" id="basicToFramesButton">用基础灯序生成</button>
            <button type="button" id="allOnFramesButton">全部画面全亮</button>
            <button type="button" id="allOffFramesButton">全部画面全灭</button>
          </div>
          <div class="hint">每个画面是 1 字节灯掩码，bit0~bit7 分别控制 LED0~LED7，可在同一画面同时点亮多颗灯。</div>
        </div>
      </div>
    </section>

    <aside class="panel output">
      <h2 class="section-title">可发送 Hex</h2>
      <div class="hex-box" id="hexOutput"></div>
      <div class="status" id="status"></div>
      <div class="quick-buttons">
        <button class="primary" type="button" id="copyButton">复制带空格 Hex</button>
        <button type="button" id="copyCompactButton">复制不带空格 Hex</button>
      </div>

      <div>
        <h2 class="section-title">字段预览</h2>
        <div class="byte-table" id="byteTable"></div>
      </div>
    </aside>
  </main>

  <script>
    const modeEl = document.getElementById("mode");
    const colorBlockEl = document.getElementById("colorBlock");
    const colorEl = document.getElementById("color");
    const colorHintEl = document.getElementById("colorHint");
    const brightnessEl = document.getElementById("brightness");
    const brightnessNumberEl = document.getElementById("brightnessNumber");
    const periodEl = document.getElementById("period");
    const periodNumberEl = document.getElementById("periodNumber");
    const periodLabelEl = document.getElementById("periodLabel");
    const periodHintEl = document.getElementById("periodHint");
    const flowBlockEl = document.getElementById("flowBlock");
    const periodBlockEl = document.getElementById("periodBlock");
    const flowOrderEl = document.getElementById("flowOrder");
    const flowCountEl = document.getElementById("flowCount");
    const flowFramesEl = document.getElementById("flowFrames");
    const hexOutputEl = document.getElementById("hexOutput");
    const statusEl = document.getElementById("status");
    const settingsStatusEl = document.getElementById("settingsStatus");
    const byteTableEl = document.getElementById("byteTable");
    const copyButtonEl = document.getElementById("copyButton");
    const copyCompactButtonEl = document.getElementById("copyCompactButton");
    const resetButtonEl = document.getElementById("resetButton");
    const clearOrderButtonEl = document.getElementById("clearOrderButton");
    const basicToFramesButtonEl = document.getElementById("basicToFramesButton");
    const allOnFramesButtonEl = document.getElementById("allOnFramesButton");
    const allOffFramesButtonEl = document.getElementById("allOffFramesButton");
    const storageKey = "rgbBluetoothHexToolSettings";
    const maxFlowFrames = 8;
    const defaultSettings = {
      mode: "1",
      color: "#00ff00",
      brightness: "17",
      flowInterval: "25",
      breathPeriod: "100",
      gradientPeriod: "20",
      order: ["3", "2", "1", "0", "4", "5", "6", "7"],
      flowFrames: [0x00]
    };
    const lampToHardware = [3, 2, 1, 0, 4, 5, 6, 7]; // 页面上排从左到右与硬件编号相反，底排保持一致。

    for (let count = 1; count <= maxFlowFrames; count += 1) {
      const option = document.createElement("option");
      option.value = String(count);
      option.textContent = `${count} 个`;
      flowCountEl.appendChild(option);
    }

    // 初始化 8 个图形化灯块，同时保留隐藏输入作为协议数据源。
    for (let index = 0; index < 8; index += 1) {
      const lamp = document.createElement("button");
      lamp.type = "button";
      lamp.className = "flow-lamp";
      lamp.dataset.lamp = String(index);
      lamp.setAttribute("aria-label", `LED ${index + 1}`);
      lamp.innerHTML = `<span class="flow-lamp-number"></span><span class="flow-lamp-step"></span>`;
      const input = document.createElement("input");
      input.id = `order${index}`;
      input.type = "hidden";
      input.min = "0";
      input.max = "7";
      input.value = String(index);
      input.dataset.orderInput = "true";
      flowOrderEl.append(lamp, input);
    }

    const orderInputs = Array.from(document.querySelectorAll("[data-order-input='true']"));
    const flowLamps = Array.from(document.querySelectorAll("[data-lamp]"));
    let flowFrames = defaultSettings.flowFrames.slice();
    let timingSettings = {
      flowInterval: defaultSettings.flowInterval,
      breathPeriod: defaultSettings.breathPeriod,
      gradientPeriod: defaultSettings.gradientPeriod
    };

    function activePeriodKey(mode) {
      if (mode === 1) return "flowInterval";
      if (mode === 2) return "breathPeriod";
      if (mode === 4 || mode === 5) return "gradientPeriod";
      return null;
    }

    function activePeriodValue(mode) {
      const key = activePeriodKey(mode);
      if (!key) return "20";
      return timingSettings[key] ?? defaultSettings[key];
    }

    function syncTimingSettingFromInput(mode) {
      const key = activePeriodKey(mode);
      if (!key) return;
      timingSettings[key] = periodEl.value;
    }

    function clampByte(value, fallback) {
      const number = Number.parseInt(value, 10);
      if (Number.isNaN(number)) return fallback;
      return Math.min(255, Math.max(0, number));
    }

    function toHex(value) {
      return clampByte(value, 0).toString(16).toUpperCase().padStart(2, "0");
    }

    function parseColor(hexColor) {
      const clean = hexColor.replace("#", "");
      return [
        Number.parseInt(clean.slice(0, 2), 16),
        Number.parseInt(clean.slice(2, 4), 16),
        Number.parseInt(clean.slice(4, 6), 16)
      ];
    }

    function clampByInput(value, input, fallback) {
      const number = Number.parseInt(value, 10);
      const min = Number.parseInt(input.min || "0", 10);
      const max = Number.parseInt(input.max || "255", 10);
      if (Number.isNaN(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function syncRangeFromNumber(numberInput, rangeInput, fallback) {
      // 数字框输入过程中允许短暂为空，避免每敲一位都被脚本改写。
      if (numberInput.value === "") return;
      rangeInput.value = String(clampByInput(numberInput.value, numberInput, fallback));
    }

    function normalizeNumberInput(numberInput, rangeInput, fallback) {
      const value = clampByInput(numberInput.value, numberInput, fallback);
      numberInput.value = String(value);
      rangeInput.value = String(value);
    }

    function syncNumberFromRange(rangeInput, numberInput) {
      numberInput.value = rangeInput.value;
    }

    function readOrder() {
      return orderInputs.map((input) => clampByte(input.value, -1));
    }

    function validateOrder(order) {
      const seen = new Set(order);
      return order.every((value) => value >= 0 && value <= 7) && seen.size === 8;
    }

    function sanitizeFlowFrames(values) {
      const clean = (Array.isArray(values) ? values : [])
        .map((value) => clampByte(value, 0))
        .slice(0, maxFlowFrames);
      return clean.length > 0 ? clean : defaultSettings.flowFrames.slice();
    }

    function orderToFlowFrames(order) {
      // 基础流水仍用旧的顺序交互，底层统一转换成单 bit 画面掩码。
      return order
        .filter((value) => value >= 0 && value <= 7)
        .slice(0, maxFlowFrames)
        .map((ledIndex) => 1 << ledIndex);
    }

    function activeFlowFrames() {
      const count = clampByte(flowCountEl.value, maxFlowFrames);
      return sanitizeFlowFrames(flowFrames).slice(0, Math.min(maxFlowFrames, Math.max(1, count)));
    }

    function writeFlowFrames(values) {
      flowFrames = sanitizeFlowFrames(values);
      flowCountEl.value = String(flowFrames.length);
    }

    function sanitizeOrderValues(values) {
      const seen = new Set();
      return values
        .map((value) => Number.parseInt(value, 10))
        .filter((value) => value >= 0 && value <= 7 && !seen.has(value) && seen.add(value));
    }

    function writeOrder(values) {
      // 隐藏输入数量固定为 8，空字符串表示该步骤还没有选灯。
      const clean = sanitizeOrderValues(values);
      orderInputs.forEach((input, index) => {
        input.value = index < clean.length ? String(clean[index]) : "";
      });
    }

    function renderFlowLamps(order) {
      const orderSteps = new Map();
      order.forEach((ledIndex, stepIndex) => {
        if (ledIndex >= 0 && ledIndex <= 7 && !orderSteps.has(ledIndex)) {
          orderSteps.set(ledIndex, stepIndex + 1);
        }
      });

      flowLamps.forEach((lamp) => {
        const ledIndex = lampToHardware[clampByte(lamp.dataset.lamp, 0)];
        const step = orderSteps.get(ledIndex);
        const stepEl = lamp.querySelector(".flow-lamp-step");
        lamp.classList.toggle("selected", Boolean(step));
        lamp.querySelector(".flow-lamp-number").textContent = step ? String(step) : "";
        stepEl.textContent = "";
      });
    }

    function renderFlowFrames() {
      const frames = activeFlowFrames();
      flowFramesEl.innerHTML = "";

      frames.forEach((mask, frameIndex) => {
        const card = document.createElement("div");
        card.className = "flow-frame-card";
        const title = document.createElement("div");
        title.className = "flow-frame-title";
        title.innerHTML = `<span>画面 ${frameIndex + 1}</span><code>${toHex(mask)}</code>`;
        const lamps = document.createElement("div");
        lamps.className = "frame-lamps";

        lampToHardware.forEach((ledIndex, displayIndex) => {
          const lamp = document.createElement("button");
          lamp.type = "button";
          lamp.className = "frame-lamp";
          lamp.classList.toggle("selected", Boolean(mask & (1 << ledIndex)));
          lamp.textContent = String(displayIndex + 1);
          lamp.addEventListener("click", () => {
            flowFrames[frameIndex] = clampByte(flowFrames[frameIndex], 0) ^ (1 << ledIndex);
            update();
          });
          lamps.appendChild(lamp);
        });

        card.append(title, lamps);
        flowFramesEl.appendChild(card);
      });
    }

    function toggleLampInOrder(ledIndex) {
      const order = sanitizeOrderValues(orderInputs.map((input) => input.value));
      const exists = order.indexOf(ledIndex);
      if (exists >= 0) {
        order.splice(exists, 1);
      } else if (order.length < 8) {
        order.push(ledIndex);
      }
      writeOrder(order);
    }

    function readSettings() {
      return {
        mode: modeEl.value,
        color: colorEl.value,
        brightness: brightnessEl.value,
        flowInterval: timingSettings.flowInterval,
        breathPeriod: timingSettings.breathPeriod,
        gradientPeriod: timingSettings.gradientPeriod,
        order: orderInputs.map((input) => input.value),
        flowFrames: activeFlowFrames()
      };
    }

    function applySettings(settings) {
      // 所有默认值和恢复值都走同一入口，避免控件状态不一致。
      modeEl.value = settings.mode;
      colorEl.value = settings.color;
      brightnessEl.value = settings.brightness;
      brightnessNumberEl.value = settings.brightness;
      timingSettings = {
        flowInterval: settings.flowInterval ?? settings.period ?? defaultSettings.flowInterval,
        breathPeriod: settings.breathPeriod ?? settings.period ?? defaultSettings.breathPeriod,
        gradientPeriod: settings.gradientPeriod ?? settings.period ?? defaultSettings.gradientPeriod
      };
      const activePeriod = activePeriodValue(clampByte(settings.mode, 1));
      periodEl.value = activePeriod;
      periodNumberEl.value = activePeriod;
      writeOrder(settings.order.slice(0, 8));
      writeFlowFrames(settings.flowFrames ?? defaultSettings.flowFrames);
    }

    function saveSettings() {
      // 把表单状态保存到浏览器本地存储，方便下次打开页面自动恢复。
      localStorage.setItem(storageKey, JSON.stringify(readSettings()));
    }

    function loadSettings() {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return;

      try {
        const settings = JSON.parse(raw);
        applySettings({
          mode: settings.mode ?? defaultSettings.mode,
          color: settings.color ?? defaultSettings.color,
          brightness: settings.brightness ?? defaultSettings.brightness,
          flowInterval: settings.flowInterval ?? settings.period ?? defaultSettings.flowInterval,
          breathPeriod: settings.breathPeriod ?? settings.period ?? defaultSettings.breathPeriod,
          gradientPeriod: settings.gradientPeriod ?? settings.period ?? defaultSettings.gradientPeriod,
          order: Array.isArray(settings.order) ? settings.order : defaultSettings.order,
          flowFrames: Array.isArray(settings.flowFrames) ? settings.flowFrames : null
        });
      } catch (error) {
        localStorage.removeItem(storageKey);
        applySettings(defaultSettings);
      }
    }

    function buildFrame() {
      const mode = clampByte(modeEl.value, 0);
      const [r, g, b] = parseColor(colorEl.value);
      const brightness = clampByte(brightnessEl.value, 0);
      const period = Math.max(1, clampByte(activePeriodValue(mode), 20));
      const order = readOrder();
      const frames = activeFlowFrames();
      const payload = [mode, r, g, b, brightness, period, frames.length, ...frames];
      const checksum = payload.reduce((sum, value) => sum ^ value, 0);
      return {
        mode,
        rgb: [r, g, b],
        brightness,
        period,
        order,
        frames,
        checksum,
        bytes: [0xAA, 0x55, ...payload, checksum]
      };
    }

    function renderModeHints(mode) {
      const isFlow = mode === 1;
      const isBreath = mode === 2;
      const isDisco = mode === 3;
      const isGradientFamily = mode === 4 || mode === 5;
      const usesPeriod = isFlow || isBreath || isGradientFamily;
      flowBlockEl.classList.toggle("hidden", !isFlow);
      periodBlockEl.classList.toggle("hidden", !usesPeriod);
      colorBlockEl.classList.toggle("hidden", isDisco || isGradientFamily);
      colorEl.disabled = isDisco || isGradientFamily;
      const currentPeriod = activePeriodValue(mode);
      periodEl.value = currentPeriod;
      periodNumberEl.value = currentPeriod;
      if (isFlow) {
        periodLabelEl.textContent = "流水间隔";
        periodHintEl.textContent = "单位 10ms，25 表示 250ms 切换一次画面。";
      } else if (isBreath) {
        periodLabelEl.textContent = "呼吸周期";
        periodHintEl.textContent = "单位 20ms，100 表示 2 秒完整呼吸周期。";
      } else if (isGradientFamily) {
        periodLabelEl.textContent = "渐变周期";
        periodHintEl.textContent = "单位 50ms，20 表示 1 秒完整渐变周期。";
      } else {
        periodLabelEl.textContent = "周期";
        periodHintEl.textContent = "当前模式不使用该字段。";
      }
    }

    function byteLabel(index, bytes) {
      if (index === 0 || index === 1) return "帧头";
      if (index === 2) return "模式";
      if (index === 3) return "R";
      if (index === 4) return "G";
      if (index === 5) return "B";
      if (index === 6) return "亮度";
      if (index === 7) return "周期";
      if (index === 8) return "画面数";
      if (index === bytes.length - 1) return "校验";
      return `画面${index - 9}`;
    }

    function renderTable(bytes) {
      byteTableEl.innerHTML = "";
      bytes.forEach((value, index) => {
        const row = document.createElement("div");
        row.className = "byte-row";
        row.innerHTML = `<span>${index}</span><strong>${toHex(value)}</strong><span>${byteLabel(index, bytes)}</span>`;
        byteTableEl.appendChild(row);
      });
    }

    function update() {
      settingsStatusEl.textContent = "";

      const frame = buildFrame();
      const hexText = frame.bytes.map(toHex).join(" ");
      const orderOk = validateOrder(frame.order);

      renderModeHints(frame.mode);
      colorHintEl.textContent = `RGB: ${frame.rgb.map(toHex).join(" ")}`;
      hexOutputEl.textContent = hexText;
      renderFlowLamps(frame.order);
      renderFlowFrames();
      renderTable(frame.bytes);

      if (frame.mode === 1 && !orderOk) {
        statusEl.innerHTML = "<span class='error'>基础流水灯序未点满；可继续使用高级画面发送，或点击“用基础灯序生成”。</span>";
      } else if (frame.mode === 1) {
        statusEl.textContent = `流水间隔：${frame.period * 10}ms，画面数：${frame.frames.length}，校验字节：${toHex(frame.checksum)}`;
      } else if (frame.mode === 2) {
        statusEl.textContent = `呼吸周期：${frame.period * 20}ms，画面数：${frame.frames.length}，校验字节：${toHex(frame.checksum)}`;
      } else if (frame.mode === 3) {
        statusEl.textContent = "Disco 模式使用板子内置的离散三色循环，RGB 和周期会被板子忽略。";
      } else if (frame.mode === 4 || frame.mode === 5) {
        statusEl.textContent = `渐变周期：${frame.period * 50}ms，画面数：${frame.frames.length}，校验字节：${toHex(frame.checksum)}`;
      } else {
        statusEl.textContent = `画面数：${frame.frames.length}，校验字节：${toHex(frame.checksum)}`;
      }

      copyButtonEl.disabled = frame.frames.length < 1;
      copyCompactButtonEl.disabled = frame.frames.length < 1;
      saveSettings();
    }

    [colorEl].forEach((el) => {
      el.addEventListener("input", update);
      el.addEventListener("change", update);
    });

    [modeEl].forEach((el) => {
      el.addEventListener("input", () => {
        renderModeHints(clampByte(modeEl.value, 0));
        update();
      });
      el.addEventListener("change", () => {
        renderModeHints(clampByte(modeEl.value, 0));
        update();
      });
    });

    flowLamps.forEach((lamp) => {
      lamp.addEventListener("click", () => {
        toggleLampInOrder(lampToHardware[clampByte(lamp.dataset.lamp, 0)]);
        update();
      });
    });

    flowCountEl.addEventListener("change", () => {
      const count = Math.min(maxFlowFrames, Math.max(1, clampByte(flowCountEl.value, maxFlowFrames)));
      const next = sanitizeFlowFrames(flowFrames);
      while (next.length < count) next.push(0);
      writeFlowFrames(next.slice(0, count));
      update();
    });

    brightnessEl.addEventListener("input", () => {
      syncNumberFromRange(brightnessEl, brightnessNumberEl);
      update();
    });

    brightnessNumberEl.addEventListener("input", () => {
      syncRangeFromNumber(brightnessNumberEl, brightnessEl, defaultSettings.brightness);
      update();
    });

    brightnessNumberEl.addEventListener("change", () => {
      normalizeNumberInput(brightnessNumberEl, brightnessEl, defaultSettings.brightness);
      update();
    });

    periodEl.addEventListener("input", () => {
      syncNumberFromRange(periodEl, periodNumberEl);
      syncTimingSettingFromInput(clampByte(modeEl.value, 0));
      update();
    });

    periodNumberEl.addEventListener("input", () => {
      syncRangeFromNumber(periodNumberEl, periodEl, activePeriodValue(clampByte(modeEl.value, 0)));
      syncTimingSettingFromInput(clampByte(modeEl.value, 0));
      update();
    });

    periodNumberEl.addEventListener("change", () => {
      normalizeNumberInput(periodNumberEl, periodEl, activePeriodValue(clampByte(modeEl.value, 0)));
      syncTimingSettingFromInput(clampByte(modeEl.value, 0));
      update();
    });

    document.querySelectorAll("[data-order]").forEach((button) => {
      button.addEventListener("click", () => {
        writeOrder(button.dataset.order.split(","));
        update();
      });
    });

    clearOrderButtonEl.addEventListener("click", () => {
      writeOrder([]);
      update();
    });

    basicToFramesButtonEl.addEventListener("click", () => {
      writeFlowFrames(orderToFlowFrames(readOrder()));
      update();
    });

    allOnFramesButtonEl.addEventListener("click", () => {
      writeFlowFrames(new Array(maxFlowFrames).fill(0xFF));
      update();
    });

    allOffFramesButtonEl.addEventListener("click", () => {
      writeFlowFrames(new Array(maxFlowFrames).fill(0x00));
      update();
    });

    copyButtonEl.addEventListener("click", async () => {
      const text = hexOutputEl.textContent;
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = "已复制带空格 Hex。";
      } catch (error) {
        statusEl.textContent = "浏览器不允许自动复制，请手动选中 Hex 文本复制。";
      }
    });

    copyCompactButtonEl.addEventListener("click", async () => {
      // 部分串口工具要求连续十六进制字符串，因此复制时去掉显示用空格。
      const text = hexOutputEl.textContent.replace(/\s+/g, "");
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = "已复制不带空格 Hex。";
      } catch (error) {
        statusEl.textContent = "浏览器不允许自动复制，请手动选中 Hex 文本复制。";
      }
    });

    resetButtonEl.addEventListener("click", () => {
      localStorage.removeItem(storageKey);
      applySettings(defaultSettings);
      update();
      settingsStatusEl.textContent = "已恢复默认配置。";
    });

    applySettings(defaultSettings);
    loadSettings();
    update();
  </script>
</body>
</html>
